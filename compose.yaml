services:
  broker:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      - "127.0.0.1:1884:1883"
    volumes:
      - ./deploy/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/config/acl:/mosquitto/config/acl:ro
      - ./deploy/mosquitto/secrets:/mosquitto/secrets:ro
      - broker-data:/mosquitto/data
  dashboard:
    build: .
    environment:
      DASHBOARD_HOST: 0.0.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  broker-data:
