global
    maxconn 20

defaults
    mode tcp
    timeout connect 5s
    timeout client 5m
    timeout server 5m

frontend mqtt_pilot_8883
    bind 0.0.0.0:8883
    tcp-request connection reject unless { src "${MQTT_PILOT_SOURCE}" }
    tcp-request inspect-delay 5s
    acl tls_hello req.ssl_hello_type 1
    acl pilot_sni req.ssl_sni -i mqtt-ebike.srv938083.hstgr.cloud
    # Never make a different HTTPS route on this shared edge reachable via the relay.
    tcp-request content reject if tls_hello !pilot_sni
    tcp-request content accept if tls_hello pilot_sni
    tcp-request content reject if WAIT_END
    default_backend mqtt_tls

backend mqtt_tls
    server edge 127.0.0.1:443
